[project]
name = "rail-coverage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "lens-test-detect-core",
    "scipy>=1.17.1",
]

[tool.uv.sources]
lens-test-detect-core = { path = "../../lens-test-detect-core", editable = true }

[project.scripts]
rail-coverage = "rail_coverage.analyze:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
