[project]
name = "tile-sharpness"
version = "0.1.0"
description = "POC: tile-grid sharpness analysis across a focus sweep, comparing JPEG size + slanted-edge MTF + radial FFT + edge decay."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "lens-test-detect-core",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "opencv-contrib-python>=4.10",
    "pandas>=2.2",
    "pillow>=11",
    "pyturbojpeg<2",
    "pywavelets>=1.9.0",
    "scikit-image>=0.24",
    "scipy>=1.13",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# Scope collection to tests/ so a bare `pytest` doesn't recurse into the .venv
# or into scripts/_recovered_extension_*/ (whose test_cross_m_relative_mtf.py
# basename collides with tests/test_cross_m_relative_mtf.py under the default
# import mode). Run the parked recovered tests explicitly by path if needed.
testpaths = ["tests"]

[project.scripts]
tile-sharpness = "tile_sharpness.cli:main"

[tool.uv.sources]
lens-test-detect-core = { path = "../../lens-test-detect-core", editable = true }

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
